<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Boredom Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: title band, then a grid of chunky game tiles. Picking a tile swaps the grid for a play stage with a score bar. */
:root{
  --bg:#e6ecf7; --panel:#fbfcff; --ink:#111b36; --muted:#55627f; --line:#111b36; --edge:#111b36;
  --a1:#ff5a36; --a2:#19b5a5; --a3:#f7b801; --a4:#8a83ff;
  --field:#0d1630; --fieldgrid:#17234b; --chalk:#f1f5ff; --on:#0b1226;
  --display:'Bungee',Impact,'Arial Black',sans-serif;
  --body:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0a1020;--panel:#16203c;--ink:#eaf0ff;--muted:#93a1c2;--line:#31416d;--edge:#04070f;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0a1020;--panel:#16203c;--ink:#eaf0ff;--muted:#93a1c2;--line:#31416d;--edge:#04070f;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--a4);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,7vw,56px);line-height:1;margin:0;text-wrap:balance}
h1 span{color:var(--a1)}
.sub{margin:12px 0 0;color:var(--muted);max-width:46ch}
.foot{margin:28px 0 0;color:var(--muted);font-size:14px}

.btn{font:600 15px/1 var(--body);border:2px solid var(--line);background:var(--a3);color:var(--on);padding:11px 16px;border-radius:10px;box-shadow:3px 3px 0 var(--edge)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.btn.ghost{background:var(--panel);color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.tile{display:flex;flex-direction:column;text-align:left;padding:0;background:var(--panel);border:2px solid var(--line);border-radius:14px;box-shadow:4px 4px 0 var(--edge);overflow:hidden;transition:transform .12s,box-shadow .12s;min-width:0}
.tile:hover,.tile:focus-visible{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--edge)}
.tile .art{display:grid;place-items:center;height:92px;color:var(--on);border-bottom:2px solid var(--line)}
.tile svg{width:50px;height:50px}
.tile .meta{display:grid;gap:4px;padding:12px 14px 14px}
.tile .name{font-family:var(--display);font-size:16px}
.tile .tag{color:var(--muted);font-size:14px}
.tile .bestline{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
.bar h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,4.5vw,32px);margin:0;flex:1;min-width:140px}
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stat{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 12px;min-width:92px}
.stat small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.help{color:var(--muted);margin:0 0 16px}

.board{position:relative;margin:0 auto;width:100%}
canvas{display:block;width:100%;height:auto;background:var(--field);border-radius:12px;border:2px solid var(--line);touch-action:none}
.overlay{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;background:color-mix(in srgb,var(--field) 84%,transparent);border-radius:12px;color:var(--chalk);padding:16px}
.overlay h3{font-family:var(--display);font-weight:400;font-size:clamp(24px,6vw,34px);margin:0}
.overlay p{margin:0 0 6px}
.result{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--panel)}
.result h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.result p{margin:0;color:var(--muted)}
.status{margin:0 0 12px;text-align:center;font-weight:600;min-height:1.5em}
.center{display:flex;justify-content:center;margin-top:14px}

.dpad{display:none;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,60px);gap:8px;justify-content:center;margin:18px auto 0}
@media (pointer:coarse){.dpad.on{display:grid}}
.dpad button{border:2px solid var(--line);border-radius:12px;background:var(--panel);font-size:24px;touch-action:manipulation}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}

/* tic-tac-toe */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--field);padding:8px;border-radius:12px}
.cell{aspect-ratio:1;border:0;border-radius:8px;background:var(--fieldgrid);font-family:var(--display);font-size:clamp(36px,12vw,60px);color:var(--chalk);display:grid;place-items:center;padding:0}
.cell:hover:not(:disabled){filter:brightness(1.3)}
.cell.x{color:var(--a1)}.cell.o{color:var(--a2)}.cell.win{outline:3px solid var(--a3)}
/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;background:var(--field);border-radius:12px}
.card{aspect-ratio:1;border:0;border-radius:10px;padding:0;display:grid;place-items:center;background:repeating-linear-gradient(45deg,var(--a4) 0 8px,color-mix(in srgb,var(--a4) 78%,#000) 8px 16px)}
.card svg{display:none;width:58%;height:58%;fill:currentColor}
.card.up,.card.done{background:var(--fieldgrid)}
.card.up svg,.card.done svg{display:block}
.card.done{outline:2px solid var(--a2)}
/* whack */
.timer{height:8px;border-radius:99px;background:var(--fieldgrid);margin-bottom:12px;overflow:hidden;border:1px solid var(--line)}
.timer i{display:block;height:100%;width:100%;background:var(--a1);transform-origin:left}
.whack{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px;background:var(--field);border-radius:12px}
.hole{position:relative;aspect-ratio:1;border:0;padding:0;background:transparent;overflow:hidden;touch-action:manipulation}
.hole::before{content:"";position:absolute;left:6%;right:6%;bottom:4%;height:32%;border-radius:50%;background:#04070f}
.mole{position:absolute;left:22%;right:22%;bottom:14%;height:64%;border-radius:50% 50% 14% 14%;background:var(--a3);transform:translateY(115%);transition:transform .07s}
.mole::before,.mole::after{content:"";position:absolute;top:30%;width:13%;aspect-ratio:1;border-radius:50%;background:var(--on)}
.mole::before{left:27%}.mole::after{right:27%}
.hole.up .mole{transform:translateY(0)}
/* 2048 */
.g2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;background:var(--field);border-radius:12px;touch-action:none}
.t{aspect-ratio:1;border-radius:8px;background:var(--fieldgrid);display:grid;place-items:center;font-family:var(--display);font-size:clamp(18px,6.5vw,32px);min-width:0}
/* minesweeper */
.mbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.mbar span{font-family:var(--mono);font-weight:700}
.ms{display:grid;gap:3px;padding:8px;background:var(--field);border-radius:12px}
.m{aspect-ratio:1;border:0;padding:0;border-radius:5px;background:color-mix(in srgb,var(--a4) 70%,var(--panel));display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:clamp(14px,4.4vw,22px);color:var(--chalk);touch-action:manipulation;min-width:0}
.m.open{background:var(--fieldgrid)}.m.bomb{background:var(--a1)}
.m svg{width:68%;height:68%}
.n1{color:#6cb6ff}.n2{color:#4fd8b4}.n3{color:#ff7a66}.n4{color:#b5a8ff}.n5{color:#ffc247}.n6{color:#5fe0e0}.n7{color:#f1f5ff}.n8{color:#9aa7c7}
/* reaction */
.react{width:100%;min-height:300px;border:2px solid var(--line);border-radius:14px;font-family:var(--display);font-size:clamp(20px,5vw,30px);color:var(--on);background:var(--a4);padding:20px;text-wrap:balance;touch-action:manipulation}
.react.wait{background:var(--a1)}.react.go{background:var(--a2)}
/* simon */
.simon{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;background:var(--field);border-radius:12px}
.pad{aspect-ratio:1;border:0;border-radius:16px;opacity:.5;transition:opacity .08s,transform .08s;touch-action:manipulation}
.pad.lit{opacity:1;transform:scale(1.03);filter:brightness(1.15)}
.pad:active{opacity:.85}
/* hangman */
.hm{display:grid;gap:16px}
.hm-art{background:var(--field);border-radius:12px;padding:12px;display:grid;place-items:center}
.hm-art svg{width:min(210px,60%);height:auto;stroke:var(--chalk);fill:none;stroke-width:4;stroke-linecap:round}
.word{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.word span{width:32px;height:44px;border-bottom:4px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:26px;text-transform:uppercase}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.keys button{padding:9px 0;border:2px solid var(--line);border-radius:8px;background:var(--panel);font-weight:600;text-transform:uppercase}
.keys button:disabled{opacity:.4;cursor:default}
.keys button.ok{background:var(--a2);color:var(--on)}.keys button.no{background:var(--a1);color:var(--on)}
/* click speed */
.clicker{width:100%;aspect-ratio:1.5;border:2px solid var(--line);border-radius:14px;background:var(--a3);color:var(--on);font-family:var(--display);font-size:clamp(28px,8vw,56px);box-shadow:4px 4px 0 var(--edge);touch-action:manipulation}
.clicker:active{transform:scale(.985)}
/* connect four */
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:8px;background:var(--a4);border-radius:12px;border:2px solid var(--line)}
.c4 button{aspect-ratio:1;border:0;border-radius:50%;background:var(--field);padding:0;touch-action:manipulation;min-width:0}
.c4 button.r{background:var(--a1)}.c4 button.y{background:var(--a3)}.c4 button.win{outline:4px solid var(--chalk);outline-offset:-2px}
/* chess */
.chess{display:grid;grid-template-columns:repeat(8,1fr);border:2px solid var(--line);border-radius:6px;overflow:hidden}
.sq{aspect-ratio:1;border:0;padding:0;display:grid;place-items:center;position:relative;font-size:clamp(22px,8vw,46px);line-height:1;touch-action:manipulation;min-width:0}
.sq.lt{background:#d5def0}.sq.dk{background:#6f84b8}
.sq.last{box-shadow:inset 0 0 0 100px rgba(247,184,1,.35)}
.sq.sel{box-shadow:inset 0 0 0 4px var(--a3)}
.sq.chk{background:#ff5a36}
.sq.hint::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(17,27,54,.38)}
.sq.cap{box-shadow:inset 0 0 0 4px rgba(255,90,54,.85)}
.pc{pointer-events:none}.pc.w{color:#fff;text-shadow:0 0 2px #0b1226,0 0 2px #0b1226,0 1px 3px #0b1226}.pc.b{color:#0b1226}
/* word guess */
.wg{display:grid;gap:6px;margin:0 auto 14px;max-width:320px}
.wg .row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tl{aspect-ratio:1;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-size:clamp(22px,7vw,30px);text-transform:uppercase;background:var(--panel)}
.tl.f{border-color:var(--ink)}
.tl.ok,.kb button.ok{background:var(--a2);color:var(--on);border-color:var(--a2)}
.tl.pr,.kb button.pr{background:var(--a3);color:var(--on);border-color:var(--a3)}
.tl.no,.kb button.no{background:var(--fieldgrid);color:var(--chalk);border-color:var(--fieldgrid)}
.kb .kr{display:flex;gap:5px;justify-content:center;margin-bottom:5px}
.kb button{flex:1;max-width:40px;padding:12px 0;border:2px solid var(--line);border-radius:8px;background:var(--panel);font-weight:600;text-transform:uppercase;font-size:14px;touch-action:manipulation}
.kb button.wide{max-width:64px;flex:1.7;font-size:12px}
/* lights out */
.lo{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px;background:var(--field);border-radius:12px}
.lo button{aspect-ratio:1;border:0;border-radius:10px;background:var(--fieldgrid);padding:0;touch-action:manipulation}
.lo button.on{background:var(--a3);box-shadow:0 0 14px var(--a3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <section id="home">
    <header>
      <div>
        <h1>Boredom <span>Arcade</span></h1>
        <p class="sub">Twenty quick games in one page, from classics like chess to a quick reflex test. Pick one, play a round, pick another.</p>
      </div>
      <button class="btn" id="surprise" type="button">Surprise me</button>
    </header>
    <div class="grid" id="grid"></div>
    <p class="foot">Best scores are saved in this browser. Press Esc during a game to come back here.</p>
  </section>

  <section id="stage" hidden>
    <div class="bar">
      <button class="btn ghost" id="back" type="button">All games</button>
      <h2 id="gname"></h2>
      <div class="hud">
        <div class="stat"><small id="slabel">Score</small><b id="sc">0</b></div>
        <div class="stat"><small>Best</small><b id="bs">-</b></div>
        <button class="btn ghost" id="restart" type="button">Restart</button>
      </div>
    </div>
    <p class="help" id="ghelp"></p>
    <div class="board" id="board"></div>
    <div class="dpad" id="dpad">
      <button class="u" data-d="u" aria-label="Up" type="button">&uarr;</button>
      <button class="l" data-d="l" aria-label="Left" type="button">&larr;</button>
      <button class="d" data-d="d" aria-label="Down" type="button">&darr;</button>
      <button class="r" data-d="r" aria-label="Right" type="button">&rarr;</button>
    </div>
  </section>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k) { try { return Number(localStorage.getItem('boredom-' + k)) || 0; } catch (e) { return 0; } },
  set(k, v) { try { localStorage.setItem('boredom-' + k, String(v)); } catch (e) {} }
};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const K = {};
['a1', 'a2', 'a3', 'a4', 'field', 'fieldgrid', 'chalk', 'on'].forEach(k => K[k] = css('--' + k));
K.grid = K.fieldgrid;
const KD = { ArrowUp: 'u', w: 'u', W: 'u', ArrowDown: 'd', s: 'd', S: 'd', ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r' };
const keyDir = e => KD[e.key] || null;
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

const home = $('#home'), stage = $('#stage'), board = $('#board'), grid = $('#grid'), dpad = $('#dpad');
const hudScore = $('#sc'), hudBest = $('#bs');
let cleanups = [], cur = null;

/* ---------- icons ---------- */
const IC = (inner) => '<svg viewBox="0 0 32 32" aria-hidden="true" fill="currentColor">' + inner + '</svg>';
const S = 'fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"';
const ICON = {
  snake: IC('<path d="M5 25h15V13h7" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/><circle cx="27" cy="13" r="3.5"/>'),
  pong: IC('<rect x="3" y="9" width="4" height="14" rx="1"/><rect x="25" y="5" width="4" height="14" rx="1"/><circle cx="16" cy="16" r="3"/>'),
  breakout: IC('<rect x="3" y="4" width="7" height="4"/><rect x="12.5" y="4" width="7" height="4"/><rect x="22" y="4" width="7" height="4"/><rect x="3" y="10" width="7" height="4"/><rect x="12.5" y="10" width="7" height="4"/><rect x="22" y="10" width="7" height="4"/><circle cx="16" cy="21" r="2.5"/><rect x="10" y="27" width="12" height="3" rx="1"/>'),
  ttt: IC('<path d="M12 4v24M20 4v24M4 12h24M4 20h24" ' + S + '/><path d="M5.5 5.5l5 5m0-5l-5 5" ' + S + '/><circle cx="16" cy="16" r="2.6" ' + S + '/>'),
  memory: IC('<rect x="3" y="6" width="14" height="20" rx="2"/><rect x="15" y="6" width="14" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="22" cy="16" r="3"/>'),
  whack: IC('<ellipse cx="16" cy="26" rx="12" ry="3.5"/><path d="M8 24c0-9 3.5-14 8-14s8 5 8 14z"/>'),
  flap: IC('<circle cx="11" cy="16" r="5.5"/><rect x="21" y="2" width="7" height="11"/><rect x="21" y="19" width="7" height="11"/>'),
  g2048: IC('<rect x="4" y="4" width="11" height="11" rx="2"/><rect x="17" y="4" width="11" height="11" rx="2" opacity=".6"/><rect x="4" y="17" width="11" height="11" rx="2" opacity=".6"/><rect x="17" y="17" width="11" height="11" rx="2" opacity=".35"/>'),
  mines: IC('<circle cx="16" cy="16" r="7"/><path d="M16 3v6M16 23v6M3 16h6M23 16h6M7 7l4 4M21 21l4 4M25 7l-4 4M11 21l-4 4" ' + S + '/>'),
  react: IC('<path d="M18 3L7 18h8l-2 11 12-16h-8z"/>'),
  simon: IC('<path d="M15 3A13 13 0 003 15h12z"/><path d="M17 3a13 13 0 0112 12H17z" opacity=".7"/><path d="M3 17h12v12A13 13 0 013 17z" opacity=".5"/><path d="M17 17h12a13 13 0 01-12 12z" opacity=".85"/>'),
  hangman: IC('<path d="M5 29h14M9 29V4h14v5" ' + S + '/><circle cx="23" cy="13" r="3.5" ' + S + '/><path d="M23 17v8M23 20l-4 3M23 20l4 3" ' + S + '/>'),
  dodge: IC('<rect x="5" y="3" width="8" height="8"/><rect x="19" y="9" width="8" height="8"/><path d="M16 21l5.5 8h-11z"/>'),
  clicker: IC('<path d="M9 4l15 11-7 1.5 4 8-3.5 1.7-4-8L9 23z"/>'),
  connect4: IC('<rect x="3" y="4" width="26" height="24" rx="3" opacity=".35"/><circle cx="10" cy="11" r="3.3"/><circle cx="22" cy="11" r="3.3"/><circle cx="10" cy="21" r="3.3"/><circle cx="16" cy="21" r="3.3"/><circle cx="22" cy="21" r="3.3"/>'),
  chess: IC('<path d="M7 28h18v-3H7zM9 25l1.5-11h11L23 25zM8 14V5h4v3h2V5h4v3h2V5h4v9z"/>'),
  tetris: IC('<rect x="4" y="5" width="7" height="7"/><rect x="12.5" y="5" width="7" height="7"/><rect x="21" y="5" width="7" height="7"/><rect x="12.5" y="13.5" width="7" height="7"/><rect x="4" y="22" width="7" height="7" opacity=".6"/><rect x="12.5" y="22" width="7" height="7" opacity=".6"/>'),

function commitBest(n) {
  if (!cur || !(n > 0)) return;
  const b = store.get(cur.id);
  if (!b || (cur.low ? n < b : n > b)) store.set(cur.id, n);
  showBest();
}
function showBest() { const b = store.get(cur.id); hudBest.textContent = b ? b : '-'; }

const api = {
  K,
  setScore(n, commit = true) { hudScore.textContent = n; if (commit) commitBest(n); },
  canvas(w, h) {
    const cv = el('canvas'); const d = Math.min(2, window.devicePixelRatio || 1);
    cv.width = w * d; cv.height = h * d; board.style.maxWidth = w + 'px'; board.appendChild(cv);
    const g = cv.getContext('2d'); g.scale(d, d);
    const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * w / r.width, y: (e.clientY - r.top) * h / r.height }; };
    return { cv, g, w, h, pos };
  },
  on(t, ev, fn, o) { t.addEventListener(ev, fn, o); cleanups.push(() => t.removeEventListener(ev, fn, o)); },
  later(fn, ms) { const id = setTimeout(fn, ms); cleanups.push(() => clearTimeout(id)); return id; },
  every(fn, ms) { const id = setInterval(fn, ms); cleanups.push(() => clearInterval(id)); return id; },
  loop(fn) {
    let on = true, last = performance.now(), id = 0;
    const f = t => {
      if (!on) return;
      const dt = Math.min(.05, Math.max(0, (t - last) / 1000)); last = t;
      if (fn(dt) === true) { on = false; return; }
      id = requestAnimationFrame(f);
    };
    id = requestAnimationFrame(f);
    cleanups.push(() => { on = false; cancelAnimationFrame(id); });
  },
  swipe(target, cb) {
    let s = null;
    api.on(target, 'pointerdown', e => { s = { x: e.clientX, y: e.clientY }; });
    api.on(target, 'pointercancel', () => { s = null; });
    api.on(target, 'pointerup', e => {
      if (!s) return;
      const dx = e.clientX - s.x, dy = e.clientY - s.y; s = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
      if (Math.abs(dx) > Math.abs(dy)) cb(dx > 0 ? 'r' : 'l'); else cb(dy > 0 ? 'd' : 'u');
    });
  },
  dpad(cb) {
    dpad.classList.add('on');
    dpad.onpointerdown = e => { const b = e.target.closest('button'); if (b) { e.preventDefault(); cb(b.dataset.d); } };
  },
  over(title, sub, inline) {
    const btn = el('button', 'btn', 'Play again'); btn.type = 'button'; btn.onclick = () => open(cur);
    if (inline) {
      const r = el('div', 'result', '<div><h3>' + title + '</h3><p>' + (sub || '') + '</p></div>'); r.appendChild(btn); board.appendChild(r);
    } else {
      const o = el('div', 'overlay', '<h3>' + title + '</h3><p>' + (sub || '') + '</p>'); o.appendChild(btn); board.appendChild(o);
    }
  }
};

function teardown() {
  cleanups.forEach(f => { try { f(); } catch (e) {} });
  cleanups = []; dpad.classList.remove('on'); dpad.onpointerdown = null;
}
function open(g) {
  teardown(); cur = g;

GAMES.push({ id: 'wordguess', name: 'Word Guess', tag: 'Six tries to find the hidden word.', help: 'Type or tap five letters, then Enter. Green is right, yellow is in the word, grey is not. Any five letters count as a guess.', color: 'a3', unit: ' words',
run(api) {
  board.style.maxWidth = '400px';
  const WORDS = 'about above actor adult after again agent alarm album alert alien alive allow alone along angel anger angle apple arena argue arise armor arrow avoid awake award beach beard beast begin below bench black blade blame blank blast blaze blind block blood board brain brave bread break brick bride brief bring brush build bunch cabin candy cargo carry catch cause chain chair chalk charm chase cheap check chess chest chief child chill claim class clean clear clerk click cliff climb clock close cloud coach coast color couch count court cover crack craft crane crash crazy cream crowd crown crush curve dance dream drink drive eager early earth eight elbow empty enemy enjoy enter equal error event every exact extra faith fancy feast fence fever field fight final flame flash fleet float flock flood floor flour focus force frame fresh front frost fruit ghost giant glass globe glory grace grain grand grape grass great green group guard guess guest guide happy heart heavy honey horse hotel house human humor ideal image inner jelly jewel juice knife knock label large laser laugh layer learn lemon level light limit lobby local logic loose lucky lunch magic major maple march match mayor medal media melon mercy metal meter might model money month moral motor mount mouse mouth movie music nerve night noble noise north novel nurse ocean offer olive onion opera orbit order other otter owner paint panel panic paper party pasta patch pause peace pearl phase phone photo piano piece pilot pitch pizza place plain plane plant plate plaza point polar pound power press price pride prime print prize proof proud pulse punch queen quest quick quiet quilt radar radio raise rally ranch range rapid reach ready realm rebel relax reply ridge right rigid river roast robot rocky round route royal salad scale scene scout sense serve seven shade shake shape share sharp sheep sheet shelf shell shift shine shirt shock shoot shore short shout sight silly skill skirt sleep slice slide small smart smile smoke snake solar solid solve sound south space spare speak speed spell spend spice spike spoon sport spray squad stack staff stage stair stamp stand stare start state steam steel steep stick still stone store storm story stove straw study stuff style sugar suite sunny super sweet swift swing sword table taste teach thank theme thick thing think three throw thumb tiger tight timer title toast today token tooth topic torch total touch tough towel tower trace track trade trail train treat trend trial tribe trick truck truly trust truth twice uncle under union unity until upper urban usage usual valid value video virus visit vital vivid vocal voice waste watch water weary wheel where which while white whole whose woman world worry worth wound write wrong yield young youth zebra'.split(' ').filter(w => w.length === 5);
  const st = el('p', 'status', 'Guess the five-letter word.'), rowsBox = el('div', 'wg'), kb = el('div', 'kb'), nx = el('button', 'btn', 'Next word'), nxw = el('div', 'center');
  nx.type = 'button'; nx.hidden = true; nxw.appendChild(nx);
  const tiles = []; for (let r = 0; r < 6; r++) { const row = el('div', 'row'); const rt = []; for (let c = 0; c < 5; c++) { const t = el('div', 'tl'); row.appendChild(t); rt.push(t); } tiles.push(rt); rowsBox.appendChild(row); }
  const kEls = {};
  const mkKey = (label, val, wide) => { const b = el('button', wide ? 'wide' : '', label); b.type = 'button'; b.onclick = () => press(val); return b; };
  ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'].forEach((line, i) => {
    const kr = el('div', 'kr'); if (i === 2) kr.appendChild(mkKey('Enter', 'Enter', true));
    line.split('').forEach(c => { const b = mkKey(c, c); kEls[c] = b; kr.appendChild(b); });
    if (i === 2) kr.appendChild(mkKey('Del', 'Back', true)); kb.appendChild(kr);
  });
  board.append(st, rowsBox, kb, nxw);
  let ans, row, curW, over, wins = 0, last = '';
  const rank = { no: 1, pr: 2, ok: 3 };
  function newWord() {
    do { ans = pick(WORDS); } while (ans === last); last = ans; row = 0; curW = ''; over = false; nx.hidden = true; st.textContent = 'Guess the five-letter word.';
    tiles.forEach(r => r.forEach(t => { t.className = 'tl'; t.textContent = ''; })); Object.values(kEls).forEach(b => { b.className = ''; });
  }
  function paint() { tiles[row].forEach((t, i) => { t.textContent = curW[i] || ''; t.className = 'tl' + (curW[i] ? ' f' : ''); }); }
  function press(k) {
    if (over) return;
    if (k === 'Back') { curW = curW.slice(0, -1); paint(); return; }
    if (k === 'Enter') { if (curW.length === 5) submit(); else st.textContent = 'Type five letters first.'; return; }
    if (curW.length < 5) { curW += k; paint(); st.textContent = 'Guess the five-letter word.'; }
  }
  function submit() {
    const res = Array(5).fill('no'), left = ans.split('');
    for (let i = 0; i < 5; i++) if (curW[i] === ans[i]) { res[i] = 'ok'; left[i] = null; }
    for (let i = 0; i < 5; i++) if (res[i] !== 'ok') { const j = left.indexOf(curW[i]); if (j >= 0) { res[i] = 'pr'; left[j] = null; } }
    res.forEach((s, i) => {
      tiles[row][i].className = 'tl ' + s; const kb2 = kEls[curW[i]];
      const old = kb2.className.replace(/\s*wide/, ''); if (!old || rank[s] > rank[old]) kb2.className = s;
    });
    if (curW === ans) { over = true; wins++; api.setScore(wins); st.textContent = 'Solved in ' + (row + 1) + (row ? ' tries.' : ' try.'); nx.hidden = false; return; }
    row++; curW = '';
    if (row >= 6) { over = true; st.textContent = 'Out of tries. The word was ' + ans + '.'; nx.hidden = false; }
  }
  api.on(window, 'keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Enter') { e.preventDefault(); press('Enter'); } else if (e.key === 'Backspace') { e.preventDefault(); press('Back'); } else if (/^[a-z]$/i.test(e.key)) press(e.key.toLowerCase());
  });
  nx.onclick = newWord; newWord();
} });

/* Lights Out */
GAMES.push({ id: 'lightsout', name: 'Lights Out', tag: 'Switch off every light on the grid.', help: 'Tapping a light flips it and the four lights next to it. Use as few taps as you can.', color: 'a3', label: 'Moves', low: true, unit: ' moves',
run(api) {
  board.style.maxWidth = '360px';
  const st = el('p', 'status', 'Turn off every light.'), gr = el('div', 'lo'); board.append(st, gr);
  const on = Array(25).fill(false); let moves = 0, over = false;
  const tog = i => { const r = Math.floor(i / 5), c = i % 5; [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => { const rr = r + dr, cc = c + dc; if (rr >= 0 && rr < 5 && cc >= 0 && cc < 5) on[rr * 5 + cc] = !on[rr * 5 + cc]; }); };
  do { on.fill(false); const n = 8 + rand(8); for (let k = 0; k < n; k++) tog(rand(25)); } while (on.every(v => !v));
  const bs = on.map((_, i) => { const b = el('button'); b.type = 'button'; b.setAttribute('aria-label', 'Light ' + (i + 1)); b.onclick = () => click(i); gr.appendChild(b); return b; });
  const render = () => bs.forEach((b, i) => { b.className = on[i] ? 'on' : ''; });
  function click(i) {
    if (over) return; tog(i); moves++; api.setScore(moves, false); render();
    if (on.every(v => !v)) { over = true; api.setScore(moves, true); st.textContent = 'All lights are off.'; api.over('Lights out', moves + ' moves.', true); }
  }
  render();
} });

/* ---------- menu ---------- */
function renderGrid() {
  grid.innerHTML = '';
  GAMES.forEach(g => {
    const b = el('button', 'tile'); b.type = 'button';
    const best = store.get(g.id);
    b.innerHTML = '<span class="art" style="background:var(--' + g.color + ')">' + ICON[g.id] + '</span><span class="meta"><span class="name">' + g.name + '</span><span class="tag">' + g.tag + '</span><span class="bestline">' + (best ? 'Best ' + best + (g.unit || '') : 'Not played yet') + '</span></span>';
    b.onclick = () => open(g); grid.appendChild(b);
  });
}
$('#back').onclick = goHome;
$('#restart').onclick = () => { if (cur) open(cur); };
$('#surprise').onclick = () => open(pick(GAMES));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !stage.hidden) goHome(); });
const ORDER = ['chess', 'connect4', 'tetris', 'snake', 'invaders', 'pong', 'breakout', 'wordguess', 'ttt', 'memory', 'flap', 'g2048', 'mines', 'lightsout', 'simon', 'hangman', 'whack', 'dodge', 'react', 'clicker'];
GAMES.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));
renderGrid();
})();
